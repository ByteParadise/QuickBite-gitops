name: validate-manifests

on:
  pull_request:
    paths:
      - 'apps/**'
      - '.github/workflows/validate.yml'
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - '.github/workflows/validate.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: imranismail/setup-kustomize@v2
      - name: Validate all overlays build
        run: |
          set -e
          for dir in apps/*/overlays/*/; do
            echo "Validating $dir"
            # gitignored env files (e.g. .env.staging) referenced by
            # configMapGenerator.envs don't exist in this checkout — create
            # empty placeholders just so kustomize build can run; real
            # values are supplied locally/at deploy time, never committed
            if [ -f "$dir/kustomization.yaml" ]; then
              for envfile in $(grep -oE '^\s*-\s*\.env\S*' "$dir/kustomization.yaml" | sed 's/^[[:space:]]*-[[:space:]]*//'); do
                [ -f "$dir$envfile" ] || touch "$dir$envfile"
              done
            fi
            kustomize build "$dir" > /dev/null
          done

