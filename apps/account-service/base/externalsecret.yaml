# ? externalsecret.yaml
# this is the resource the Deployment actually consumes (via `envFrom.secretRef
# in `deployment.yaml`) — it tells External Secrets Operator (ESO) to create
# a real Kubernetes `Secret` named `account-service-secrets`, populated by
# pulling values out of AWS Secrets Manager rather than from anything committed
# to Git.

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: account-service-secrets
spec:
  # points at the Kubernetes `Secret` ESO will create/maintain. Set to
  # `account-service-secrets` specifically because that's the exact name
  # the Deployment's `envFrom.secretRef` already expects — if these don't
  # match, the pod gets no env vars from this at all
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    # the Secret name the Deployment's envFrom.secretRef already expects
    name: account-service-secrets
  # the actual field mapping, one entrt per key
  data:
    - secretKey: STRIPE_SECRET_KEY
      remoteRef:
        key: quickbite/account-service/STRIPE_SECRET_KEY
