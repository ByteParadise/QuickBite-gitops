# ? service.yaml
# Service gits a stable network name + IP for a group of Pods.
# Pods are ephemeral — so nothing should ever talk to a Pod's IP
# directly. The service its in front of them, load-balancing
# traffic across whichever Pods currently match its selector

apiVersion: v1
kind: Service
metadata:
  name: account-service
spec:
  selector:
    app: account-service
  ports:
    - port: 80
      targetPort: 4003
