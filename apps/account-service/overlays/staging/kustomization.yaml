# ? Kustomize
# Kustomize is a configuration-management tool for Kubernetes YAML (yaml files
# written in the specific schema Kubernetes understands) — it lets you
# keep one set of "base" manifests and layer environment-specific
# changes (overlays) on top, without copy-pasting or templating the base
# files themselves

# ? kustomization.yaml
# This is Kustomize's entry-point file for the overlays/staging/ directory.
# Running `kustomize build overlays/staging` (or `kubectl apply -k`) reads
# this file and proces the final merged YAML sent to the cluster, by
# layering transformations on top of `base/` without every copying or
# forking its files

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# pulls in everything declared in base/kustomization.yaml
resources:
- ../../base

# applied to every namespaced resource pulled in above (Deployment, Service,
# ConfigMap, ServiceAccount) — Kustomize automatically skips cluster-scoped
# kinds like Namespace itself, so this doesn't conflict with namespace.yaml
namespace: account-service

# finds any container image in the resourses matching name, and
# overrides its tag with newTag. This is the hook the CI job will
# use later — instead of hand-editing the Deployment, CI just runs
# `kustomize edit set image ...` here to bump the tag
    # overwritten by CI's GitOps-commit step on each push
images:
- name: account-service
  newName: 555044956548.dkr.ecr.us-east-1.amazonaws.com/quickbite/account-service
  newTag: 2d6ae38aec7a04ac59a90b36045562cab0f4f5de

# generates a brand-new ConfigMap from the literals, appends a content
# hash to its name, and auto-rewrites any `configMapRef` in the pulled-in
# resources to point at that hashed name
      # not secret — IAM auth replaces the password entirely, so the
      # username alone is no more sensitive than the DB name above.
      # must match rds.tf's aws_db_instance.account_service.username
      # TODO(Phase D): replace once Auth0/identity provider is wired up
configMapGenerator:
- literals:
  - AWS_REGION=us-east-1
  - PORT=4003
  - POSTGRES_PORT=5432
  - POSTGRES_DB=account
  - POSTGRES_HOST=quickbite-account-service.proxy-c43e08e8smkw.us-east-1.rds.amazonaws.com
  - POSTGRES_USER=account_service_app
  - AUTH0_DOMAIN=dev-syl7b8tbl6zxwq8i.us.auth0.com
  - AUTH0_AUDIENCE=https://quickbite-account-service
  name: account-service-config
